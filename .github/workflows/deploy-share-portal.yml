name: Deploy Tester Share Portal

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "9c5f81e73d237bab60bdb0bc2085cd56"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY || vars.CLOUDFLARE_API_KEY || secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
        run: |
          RAW="$(printf '%s' "$RAW_CLOUDFLARE_TOKEN" | tr -d '\r\n')"
          RAW="$(printf '%s' "$RAW" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TOKEN="$(printf '%s' "$RAW" | grep -oE 'cfat_[A-Za-z0-9_-]+' | head -n 1 || true)"
          if [ -z "$TOKEN" ]; then
            TOKEN="$RAW"
          fi
          if [ -z "$TOKEN" ]; then
            echo "Cloudflare API token is empty."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify Cloudflare authentication
        working-directory: cloudflare/share-worker
        run: wrangler whoami

      - name: Validate administrator setup and recovery key
        shell: bash
        env:
          PORTAL_BOOTSTRAP_SECRET: ${{ secrets.SHARE_PORTAL_BOOTSTRAP_SECRET }}
        run: |
          if [ -z "$PORTAL_BOOTSTRAP_SECRET" ]; then
            echo "Add the SHARE_PORTAL_BOOTSTRAP_SECRET repository secret before deploying."
            exit 1
          fi

      - name: Ensure per-user auth database exists
        run: node cloudflare/share-worker/scripts/ensure-auth-database.mjs

      - name: Apply auth database schema
        working-directory: cloudflare/share-worker
        run: wrangler d1 migrations apply cheatvision-share-auth --remote

      - name: Configure administrator setup and recovery key
        working-directory: cloudflare/share-worker
        shell: bash
        env:
          PORTAL_BOOTSTRAP_SECRET: ${{ secrets.SHARE_PORTAL_BOOTSTRAP_SECRET }}
        run: printf '%s' "$PORTAL_BOOTSTRAP_SECRET" | wrangler secret put BOOTSTRAP_SECRET

      - name: Ensure tester-share R2 bucket exists
        working-directory: cloudflare/share-worker
        run: wrangler r2 bucket create cheatvision-share || true

      - name: Deploy tester share
        working-directory: cloudflare/share-worker
        run: wrangler deploy

      - name: Verify deployed health endpoint
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://cheatvision-share.sensoredrooster-com.workers.dev/health" | tee health.json; then
              grep -q '"ok":true' health.json
              exit 0
            fi
            sleep 2
          done
          exit 1
